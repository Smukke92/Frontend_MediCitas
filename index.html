<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediCitas - Registro de Paciente</title>
  <!-- Tailwind CSS CDN para la interfaz -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-xl w-full bg-white rounded-xl shadow-lg border border-slate-200 p-8">
    
    <!-- Encabezado -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-800">MediCitas Legacy</h1>
      <p class="text-sm text-slate-500 mt-1">Registro de Paciente Nuevo</p>
    </div>

    <!-- Mensaje de Estado / Alerta -->
    <div id="alert-box" class="hidden mb-4 p-4 rounded-lg text-sm font-medium"></div>

    <!-- Formulario de Registro -->
    <form id="registro-form" class="space-y-4">

      <!-- Nombres y Apellidos -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Nombre</label>
          <input type="text" id="nombre" required placeholder="Ej. Ana Sofía"
            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Apellido</label>
          <input type="text" id="apellido" required placeholder="Ej. Martínez Ruiz"
            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" />
        </div>
      </div>

      <!-- Tipo y Número de Documento -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Tipo Doc.</label>
          <select id="tipoDocumento" required
            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none bg-white transition">
            <option value="CC">CC</option>
            <option value="CE">CE</option>
            <option value="TI">TI</option>
            <option value="PAS">Pasaporte</option>
          </select>
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-slate-700 mb-1">Número de Documento</label>
          <input type="text" id="numeroDocumento" required placeholder="Ej. 1098765432"
            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" />
        </div>
      </div>

      <!-- Teléfono y Fecha de Nacimiento -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Teléfono</label>
          <input type="tel" id="telefono" placeholder="Ej. 3001234567"
            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Fecha de Nacimiento</label>
          <input type="date" id="fechaNacimiento" required
            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" />
        </div>
      </div>

      <hr class="my-4 border-slate-200" />

      <!-- Correo Electrónico -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico</label>
        <input type="email" id="correo" required placeholder="usuario@correo.com"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" />
      </div>

      <!-- Contraseña -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
        <input type="password" id="contrasena" minlength="6" required placeholder="••••••••"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" />
      </div>

      <!-- Botón de Envío -->
      <button type="submit" id="btn-submit"
        class="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg shadow transition duration-200 flex items-center justify-center">
        <span>Registrar Paciente</span>
      </button>

    </form>
  </div>

  <script>
    // =========================================================================
    // ENDPOINT DEL BACKEND DESPLEGADO EN RENDER
    // =========================================================================
    const API_URL = 'https://backend-medicitas-legacy.onrender.com/api/registro';

    const form = document.getElementById('registro-form');
    const alertBox = document.getElementById('alert-box');
    const btnSubmit = document.getElementById('btn-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      mostrarAlerta(false);
      setLoading(true);

      // 1. Construir el objeto exactamente igual a la clase RegistroRequest del Backend
      const payload = {
        correo: document.getElementById('correo').value.trim(),
        contrasena: document.getElementById('contrasena').value,
        tipoDocumento: document.getElementById('tipoDocumento').value,
        numeroDocumento: document.getElementById('numeroDocumento').value.trim(),
        nombre: document.getElementById('nombre').value.trim(),
        apellido: document.getElementById('apellido').value.trim(),
        telefono: document.getElementById('telefono').value.trim() || "",
        fechaNacimiento: document.getElementById('fechaNacimiento').value
      };

      try {
        // 2. Realizar la petición HTTP POST a la API
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const resultado = await response.json();

        if (!response.ok) {
          throw new Error(resultado.error || 'Ocurrió un error al procesar el registro.');
        }

        // Registro exitoso
        mostrarAlerta(true, resultado.message || '¡Paciente registrado exitosamente!', 'exito');
        form.reset();

      } catch (err) {
        console.error('Error enviando datos:', err);
        mostrarAlerta(true, err.message || 'Error de conexión con el servidor.', 'error');
      } finally {
        setLoading(false);
      }
    });

    // Cambiar estado del botón
    function setLoading(cargando) {
      if (cargando) {
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = `
          <svg class="animate-spin h-5 w-5 mr-3 text-white inline" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg> Guardando...`;
      } else {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `<span>Registrar Paciente</span>`;
      }
    }

    // Mostrar mensajes
    function mostrarAlerta(mostrar, mensaje = '', tipo = 'error') {
      if (!mostrar) {
        alertBox.classList.add('hidden');
        return;
      }

      alertBox.className = 'mb-4 p-4 rounded-lg text-sm font-medium border';
      
      if (tipo === 'exito') {
        alertBox.classList.add('bg-green-100', 'text-green-700', 'border-green-400');
      } else {
        alertBox.classList.add('bg-red-100', 'text-red-700', 'border-red-400');
      }

      alertBox.innerText = mensaje;
    }
  </script>
</body>
</html>
